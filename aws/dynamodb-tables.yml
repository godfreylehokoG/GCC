AWSTemplateFormatVersion: '2010-09-09'
Description: DynamoDB tables for The Wealth Mindset lead capture and event registrations.

Parameters:
  LeadsTableName:
    Type: String
    Default: wealth_mindset_leads
  RegistrationsTableName:
    Type: String
    Default: wealth_mindset_event_registrations

Resources:
  LeadsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref LeadsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  EventRegistrationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref RegistrationsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  LeadsTableName:
    Description: DynamoDB table for general website leads.
    Value: !Ref LeadsTable
  EventRegistrationsTableName:
    Description: DynamoDB table for event registrations.
    Value: !Ref EventRegistrationsTable
